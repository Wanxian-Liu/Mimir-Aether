# Ralph Tier-0/1: same gates as ./run_ralph_tier0.sh (Gate1 compile/import, Gate2 pytest, Gate3 tier1 e2e)
# If CI fails on import, add the missing package to requirements-ci.txt (single source of truth).
# Actions 运行时（2026-09-16 核实）：checkout@v5 / setup-python@v6 均为 **node24**；
# 旧的 v4 / v5 是 node20，GitHub 已在跑运行时打弃用告警。改动仅版本号，无行为变更。

name: Ralph Tier-0

on:
  workflow_dispatch:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ralph:
    runs-on: ubuntu-latest
    # 防挂死：Ralph 正常 3~4 分钟。无 timeout 时一旦挂死会长期占并发位，
    # 把后续 push 的 CI 一并取消（concurrency.cancel-in-progress=true）。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # 2026-10-08（CI Only-Red 根因）：checkout 默认浅克隆不带 tag ⇒
          # tests/contract/test_mimicore_openclaw_boundary_ind04.py 的
          # `git show mimicore-archived-20260918` 不可达而失败（纪念堂凭证）。
          fetch-depth: 0
          fetch-tags: true

      # （2026-09-18 更新）mimicore 子模块已在纪念堂仪式中归档 ⇒ 本仓 .gitmodules 已空。
      # 原文「mimicore lives in a submodule … CI must init it or Gate1 import fails」现为**假陈述**。
      # 保留本步为显式 no-op：无子模块条目即直接退出（不再尝试 sync/update）。
      - name: Init git submodules (no-op when none declared)
        env:
          # Optional: repo secret SUBMODULE_PAT (fine-grained/classic PAT with read to submodule repos).
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          set -euo pipefail
          if [ ! -f .gitmodules ] || ! grep -q '^\[submodule' .gitmodules; then
            echo "no submodules declared (.gitmodules absent/empty) — mimicore archived 2026-09-18; skipping"
            exit 0
          fi
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          if [ -n "${SUBMODULE_PAT:-}" ]; then
            git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
          fi
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies for tests
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      # 2026-10-08 新增（CI Only-Red 根因 · DevOps：环境即代码）。
      # 本仓部分测试依赖 `$HOME/.mimiraether/{scripts,data/ops}`（运行时数据面）。
      # 该面在 CI 上不存在 ⇒ FileNotFound。正解**不是**让测试跳过（覆盖面缩水 +
      # 训练出对 skip 麻木），而是让 CI **自举**出所需数据面：源在仓内
      # （scripts/ + tests/fixtures/），部署到 $HOME ⇒ 同一份源，两环境都真跑。
      - name: Bootstrap local data surface for tests
        run: |
          set -euo pipefail
          HOME_DIR="$HOME/.mimiraether"
          mkdir -p "$HOME_DIR/scripts" "$HOME_DIR/data/ops"
          cp scripts/buzz_inbox_claim.py "$HOME_DIR/scripts/"
          cp scripts/buzz-inbox-watcher.sh "$HOME_DIR/scripts/"
          cp scripts/probe_firstline_wake.py "$HOME_DIR/scripts/"
          chmod +x "$HOME_DIR/scripts/buzz-inbox-watcher.sh"
          # mech_checks.json 含占位符真值（本机绝对路径）⇒ 就地改写为 CI 路径
          sed -e "s#__REPO__#${GITHUB_WORKSPACE}#g" \
              -e "s#__HOME__#${HOME_DIR}#g" \
              -e "s#__CHAT_ID__#oc_local_placeholder#g" \
              tests/fixtures/mech_checks.json > "$HOME_DIR/data/ops/mech_checks.json"
          echo "bootstrapped data surface at $HOME_DIR"
          ls -la "$HOME_DIR/scripts" "$HOME_DIR/data/ops"

      - name: Run Ralph (Gate1–3)
        run: ./run_ralph_tier0.sh
