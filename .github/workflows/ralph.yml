# Ralph Tier-0/1: same gates as ./run_ralph_tier0.sh (Gate1 compile/import, Gate2 pytest, Gate3 tier1 e2e)
# If CI fails on import, add packages to the pip install line below (match your local `pip freeze`).

name: Ralph Tier-0

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master]

jobs:
  ralph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies for tests
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio pyyaml aiohttp python-dotenv

      - name: Run Ralph (Gate1–3)
        run: ./run_ralph_tier0.sh
