# Minimal lint — pyflakes on agent/ core code.
# Advisory only (exits 0 always). Merge gate remains: ralph.yml (./run_ralph_tier0.sh).
# See docs/HERMES_CI_GAP.md for Hermes workflows we intentionally do NOT implement.
# Actions 运行时（2026-09-16 核实）：checkout@v5 / setup-python@v6 均为 **node24**；
# 旧的 v4 / v5 是 node20，GitHub 已在跑运行时打弃用告警。改动仅版本号，无行为变更。

name: Lint (advisory)

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pyflakes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pyflakes
        run: pip install --quiet pyflakes

      - name: Run pyflakes (agent/)
        run: |
          echo "### pyflakes diagnostics for agent/" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pyflakes agent/ >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Done. Exit 0 — advisory only." >> "$GITHUB_STEP_SUMMARY"
