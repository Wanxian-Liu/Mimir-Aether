# Optional wide pytest — NOT a merge gate. Use workflow_dispatch or schedule for health signal.
# PR merge gate remains: ./run_ralph_tier0.sh (.github/workflows/ralph.yml).
# Actions 运行时（2026-09-16 核实）：checkout@v5 / setup-python@v6 均为 **node24**；
# 旧的 v4 / v5 是 node20，GitHub 已在跑运行时打弃用告警。改动仅版本号，无行为变更。

name: Pytest wide (optional)

on:
  workflow_dispatch:
  schedule:
    # Weekly Sunday 06:00 UTC — disable by deleting schedule if too noisy
    - cron: "0 6 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest-wide:
    runs-on: ubuntu-latest
    # 全量测试较慢，给足余量但必须封顶（否则周日定时任务挂死会一直占位）。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Init git submodules
        env:
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          if [ -n "${SUBMODULE_PAT:-}" ]; then
            git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
          fi
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      # agent/test_integration.py is not part of tier0 and can drift; exclude for a stable optional signal.
      - name: Wide pytest (agent, gateway, tools — exclude vendored hermes_cli)
        run: |
          python3 -m pytest -q agent/ gateway/ tools/ \
            --ignore=tools/hermes_cli/ \
            --ignore=agent/test_integration.py
