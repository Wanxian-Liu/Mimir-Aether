agent:
  max_turns_tiers:
    short: 20
    medium: 40
    long: 90

# E2 句柄化（2026-08-19 · Loki 审计 P1-D——env 单一来源同步）
tools:
  artifact_handle_threshold_kb: 30  # 大文件句柄化阈值（>30KB 返回引用）——0=关闭
