FEISHU_HOME_CHANNEL: oc_8af3ea46411e607b3a2e7f2ceed694e8
context:
  max_recent_messages: 200
model:
  default: deepseek/deepseek-v4-flash
platforms:
  feishu:
    enabled: true
    extra:
      app_id: ${FEISHU_APP_ID}
      app_secret: ${FEISHU_APP_SECRET}
      connection_mode: websocket
      domain: feishu
